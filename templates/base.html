<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ profile.name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <header class="masthead">
    <div class="masthead-bar">
      <span>ISSUE&nbsp;NO.&nbsp;01</span>
      <span>{{ profile.location|upper }}</span>
      <span>EST. CSE '25</span>
    </div>
    <a class="masthead-title" href="{{ url_for('index') }}">{{ profile.name|upper }}</a>
    <p class="masthead-sub">ML &middot; COMPUTER VISION &middot; NLP &middot; FULL&#8209;STACK</p>
    <nav class="cover-nav">
      <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}is-active{% endif %}">Index</a>
      <a href="{{ url_for('projects') }}" class="{% if request.endpoint in ['projects', 'project_detail'] %}is-active{% endif %}">Projects</a>
      <a href="{{ url_for('about') }}" class="{% if request.endpoint == 'about' %}is-active{% endif %}">About</a>
      <a href="mailto:{{ profile.contact.email }}">Contact</a>
    </nav>
  </header>

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  <footer class="masthead-footer">
    <span>{{ profile.name|upper }} — PERSONAL PORTFOLIO</span>
    <span><a href="{{ profile.contact.github }}">GitHub</a> &nbsp;/&nbsp; <a href="{{ profile.contact.linkedin }}">LinkedIn</a></span>
  </footer>

</body>
</html>

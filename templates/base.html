<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ profile.name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <a class="wordmark" href="{{ url_for('index') }}">{{ profile.name }}</a>
        <p class="role">CSE student &middot; ML / CV / full-stack</p>
      </div>
      <nav class="nav">
        <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}is-active{% endif %}">Index</a>
        <a href="{{ url_for('projects') }}" class="nav-link {% if request.endpoint in ['projects', 'project_detail'] %}is-active{% endif %}">Projects</a>
        <a href="{{ url_for('about') }}" class="nav-link {% if request.endpoint == 'about' %}is-active{% endif %}">About</a>
        <a href="mailto:{{ profile.contact.email }}" class="nav-link">Contact</a>
      </nav>
      <div class="sidebar-bottom">
        <a href="{{ profile.contact.github }}" class="quiet-link">GitHub</a>
        <a href="{{ profile.contact.linkedin }}" class="quiet-link">LinkedIn</a>
        <p class="location">{{ profile.location }}</p>
      </div>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>

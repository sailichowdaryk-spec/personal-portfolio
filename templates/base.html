<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ profile.name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <div class="floaters" aria-hidden="true">
    <span class="dot d-blue"></span>
    <span class="dot d-pink"></span>
    <span class="dot d-yellow"></span>
    <span class="dot d-green"></span>
    <span class="dot d-blue d-small"></span>
    <span class="dot d-pink d-small"></span>
  </div>

  <header class="topbar">
    <div class="brand">
      <a href="{{ url_for('index') }}" class="logo">{{ profile.name[0] }}</a>
      <button id="pause-btn" class="pause-btn" type="button">⏸ pause animations</button>
    </div>
    <nav class="toplinks">
      <a href="{{ url_for('projects') }}" class="{% if request.endpoint in ['projects', 'project_detail'] %}is-active{% endif %}">WORK</a>
      <a href="{{ url_for('about') }}" class="{% if request.endpoint == 'about' %}is-active{% endif %}">ABOUT</a>
    </nav>
  </header>

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="folder-card">
      <div class="folder-back"></div>
      <div class="folder-note">
        <p class="note-title">{{ profile.name }}'s<br>portfolio</p>
        <p class="note-sub">{{ profile.location }}</p>
      </div>
    </div>
    <div class="footer-links">
      <a href="{{ url_for('projects') }}">Work</a>
      <a href="{{ url_for('about') }}">About</a>
      <a href="mailto:{{ profile.contact.email }}">Contact</a>
      <div class="footer-social">
        <a href="{{ profile.contact.github }}">GitHub</a>
        <a href="{{ profile.contact.linkedin }}">LinkedIn</a>
      </div>
    </div>
  </footer>
  <p class="footer-credit">site coded with 💛 in Flask</p>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
